name = "atmos-web"
main = "src/api/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat_v2"]

# Served only from the custom domains below: no *.workers.dev URL and no
# preview URLs, since those would sit outside the Cloudflare Access application.
workers_dev = false
preview_urls = false

# run_worker_first: with single-page-application handling, browser navigations
# are answered by the asset layer without ever reaching the Worker. The API and
# the pages that need per-resource OGP tags (docs/PLAN.md §6) must go through
# the Worker first; everything else is served straight from dist/.
[assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*", "/projects/*", "/users/*"]

[observability]
enabled = true
head_sampling_rate = 1

[dev]
port = 8787
ip = "0.0.0.0"
local_protocol = "http"

# --- Vars / secrets ---
# ACCESS_TEAM_DOMAIN: Cloudflare Access team domain without scheme
#   (e.g. "myteam.cloudflareaccess.com"). The JWKS is fetched from
#   https://<ACCESS_TEAM_DOMAIN>/cdn-cgi/access/certs
# ACCESS_AUD: Application Audience (AUD) tag of the Access application.
# INIT_ADMIN_KEY is a secret: its value is never written here. Set it with
#   wrangler secret put INIT_ADMIN_KEY [--env staging|production]
# [secrets] only declares the name, so `wrangler types` emits it and local dev
# warns when it is missing. For local development, copy .dev.vars.example to
# .dev.vars.
# The var values below are placeholders until the Access application exists.
[vars]
ACCESS_TEAM_DOMAIN = "example.cloudflareaccess.com"
ACCESS_AUD = "placeholder-access-aud"

[secrets]
required = ["INIT_ADMIN_KEY"]

# --- Bindings ---
# D1: atmos (production, also the top-level default) and atmos-staging.
# R2: atmos-assets and atmos-assets-staging.
# Migrations are flat .sql files generated by drizzle-kit (see drizzle.config.ts).
# migrations_pattern is explicit so that a directory-style migration is not
# silently skipped by `wrangler d1 migrations apply`.
[[d1_databases]]
binding = "DB"
database_name = "atmos"
database_id = "48cd4683-e63a-43a5-bac4-44dafcbb937a"
migrations_dir = "src/db/migrations"
migrations_pattern = "src/db/migrations/*.sql"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "atmos-assets"

# One JobLive instance per job_id (docs/PLAN.md §1), WebSocket Hibernation API.
[[durable_objects.bindings]]
name = "JOB_LIVE"
class_name = "JobLive"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobLive"]

# --- Environments ---
# vars and bindings are not inherited by environments, so each one repeats them.

[env.staging]
name = "atmos-web-staging"
workers_dev = false
preview_urls = false
routes = [{ pattern = "atmos-staging.qleap.jp", custom_domain = true }]

[env.staging.assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*", "/projects/*", "/users/*"]

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.vars]
ACCESS_TEAM_DOMAIN = "example.cloudflareaccess.com"
ACCESS_AUD = "placeholder-access-aud"

[env.staging.secrets]
required = ["INIT_ADMIN_KEY"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "atmos-staging"
database_id = "c2bd5502-003c-4db8-93f7-a91f0aef93c5"
migrations_dir = "src/db/migrations"
migrations_pattern = "src/db/migrations/*.sql"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "atmos-assets-staging"

[[env.staging.durable_objects.bindings]]
name = "JOB_LIVE"
class_name = "JobLive"

[env.production]
name = "atmos-web"
workers_dev = false
preview_urls = false
routes = [{ pattern = "atmos.qleap.jp", custom_domain = true }]

[env.production.assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*", "/projects/*", "/users/*"]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.vars]
ACCESS_TEAM_DOMAIN = "example.cloudflareaccess.com"
ACCESS_AUD = "placeholder-access-aud"

[env.production.secrets]
required = ["INIT_ADMIN_KEY"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "atmos"
database_id = "48cd4683-e63a-43a5-bac4-44dafcbb937a"
migrations_dir = "src/db/migrations"
migrations_pattern = "src/db/migrations/*.sql"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "atmos-assets"

[[env.production.durable_objects.bindings]]
name = "JOB_LIVE"
class_name = "JobLive"
