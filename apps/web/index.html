<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="atmos experiment tracker" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>atmos</title>
    <!-- Paints the first frame in the chosen theme. Same key and rules as src/app/lib/theme.ts. -->
    <script>
      ;(() => {
        try {
          // Storage may throw on a locked-down page; that alone must not stop a dark OS from
          // painting dark, so it gets its own guard and falls back to "system".
          const preference = (() => {
            try {
              const stored = localStorage.getItem('atmos-theme')
              return stored === 'light' || stored === 'dark' ? stored : 'system'
            } catch {
              return 'system'
            }
          })()
          const dark =
            preference === 'dark' ||
            (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          // No matchMedia: stay light until React takes over.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
