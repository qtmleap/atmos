name: Deploy to Cloudflare Workers
on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    name: Wrangler Deploy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: self-hosted
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock', 'apps/web/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Determine environment
        run: |
          if [[ '${{ github.event.pull_request.base.ref }}' =~ ^(master|main)$ ]] \
            || [[ '${{ github.event_name }}' == 'workflow_dispatch' && '${{ github.ref_name }}' =~ ^(master|main)$ ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Worker types
        run: bun run cf-typegen

      - name: Build
        # Vite only warns when a CSS url() does not resolve, and the url then
        # falls through to index.html at runtime (every font did, once). Fail
        # the deploy instead.
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
          if grep -q "didn't resolve at build time" build.log; then
            echo "::error::CSS url() left unresolved by the build"
            exit 1
          fi
        env:
          CLOUDFLARE_ENV: ${{ env.ENVIRONMENT }}

      # Before the deploy, so new code never runs against a schema it does not
      # expect. A failed migration stops the deploy.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: latest
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: d1 migrations apply DB --remote --env ${{ env.ENVIRONMENT }}

      - name: Wrangler deploy
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: latest
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env ${{ env.ENVIRONMENT }}

  # The self-hosted image (apps/web/Dockerfile). Built here so whoever runs it
  # only pulls from GHCR; the GitHub Packages token that `bun install` needs
  # stays inside CI. develop publishes :staging, master publishes :latest and
  # :<version>.
  image:
    name: Publish Docker image
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Determine tags
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          VERSION=$(jq -r .version package.json)
          if [[ '${{ github.event.pull_request.base.ref }}' =~ ^(master|main)$ ]] \
            || [[ '${{ github.event_name }}' == 'workflow_dispatch' && '${{ github.ref_name }}' =~ ^(master|main)$ ]]; then
            echo "TAGS=$IMAGE:latest,$IMAGE:$VERSION,$IMAGE:sha-${GITHUB_SHA::7}" >> $GITHUB_ENV
          else
            echo "TAGS=$IMAGE:staging,$IMAGE:sha-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          push: true
          tags: ${{ env.TAGS }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
