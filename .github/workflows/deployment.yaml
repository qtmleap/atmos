name: Deploy to Cloudflare Workers
on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    name: Wrangler Deploy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: self-hosted
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock', 'apps/web/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Determine environment
        run: |
          if [[ '${{ github.event.pull_request.base.ref }}' =~ ^(master|main)$ ]] \
            || [[ '${{ github.event_name }}' == 'workflow_dispatch' && '${{ github.ref_name }}' =~ ^(master|main)$ ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Worker types
        run: bun run cf-typegen

      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_ENV: ${{ env.ENVIRONMENT }}

      - name: Wrangler deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: latest
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env ${{ env.ENVIRONMENT }}
