name: Publish Python SDK
# Attaches the SDK's wheel and sdist to the GitHub release of each version tag,
# so it installs without cloning the repository. Not published to PyPI: the
# name `atmos` there belongs to an unrelated package.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the build to (e.g. v0.1.2)
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build and attach
    runs-on: self-hosted
    defaults:
      run:
        working-directory: packages/python-sdk
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build
        run: uv build --out-dir dist
      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber
