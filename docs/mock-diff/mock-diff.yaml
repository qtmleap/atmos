# mock diff ビューアの設定。ワークスペースはこのディレクトリ (docs/mock-diff)。
#
# 画面を足すときはモックを designs/ に置き、ここに一画面ぶん書き足す。
# 候補を並べるなら versions に名前を変えて並べ、実装ができたら actual に
# type: url で開発サーバーを指す。どれを決定稿にしたかはここには書かない
# (ビューアが mock-diff.adopted.yaml に書く)。
#
# 部品カタログは designs/components/、共通の CSS は designs/_shared/atmos.css。
screens:
  - id: component-foundations
    name: 基礎
    category: コンポーネント
    devices:
      - id: desktop
        name: Desktop 1440
        viewport: {width: 1440, height: 900, deviceScaleFactor: 2}
        colorSchemes: [light, dark]
        versions:
          astra: {type: html, path: designs/components/foundations.html}
        actual: {type: url, url: "http://localhost:12155/catalog/foundations"}
