    .chart-dialog-sep { width: 1px; height: 16px; margin-inline: 4px; background: var(--border); }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding-block: 8px; list-style: none; margin: 0; }

    .chart-legend .swatch { width: 12px; height: 2px; flex-shrink: 0; }
    .chart-legend .label { font-size: 12px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chart-dialog-canvas { position: relative; flex: 1 1 auto; min-height: 0; }
    .chart-dialog-canvas .chart-svg { height: 100%; cursor: grab; }
