<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プロフィール設定 · atmos</title>
  <link rel="stylesheet" href="../_shared/atmos.css">
  <style>
    .page-content { max-width: 1600px; margin: 0 auto; padding: 16px 32px 24px; }
    .settings-layout { display: grid; grid-template-columns: 216px minmax(0, 640px); gap: 48px; padding-top: 32px; }
    .settings-nav { display: grid; align-content: start; gap: 4px; }
    .settings-nav a { justify-content: flex-start; }
    .settings-nav [aria-current="page"] { background: var(--accent); }
    .settings-section { display: grid; gap: 24px; }
    .settings-form { display: grid; gap: 24px; }
    .avatar-profile { width: 64px; height: 64px; font-size: 24px; }
    .avatar-upload { position: relative; display: inline-flex; }
    .avatar-upload input { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
    .avatar-upload:focus-within { outline: 3px solid var(--ring); border-radius: var(--radius-md); }
    .handle-notice { display: flex; align-items: flex-start; gap: 8px; color: var(--muted-foreground); }
    .handle-notice .icon { margin-top: 1px; }
    .form-actions { display: flex; align-items: center; gap: 12px; padding-top: 24px; border-top: 1px solid var(--border); }
    @media (max-width: 700px) { .page-content { padding-inline: 16px; } .settings-layout { grid-template-columns: 1fr; gap: 24px; } .settings-nav { display: flex; } }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <a class="app-logo" href="/" aria-label="atmos ホーム">atmos</a>
    <nav class="app-nav" aria-label="ログイン時のナビゲーション"><a href="/">プロジェクト</a><a href="/users">メンバー</a></nav>
    <div class="app-account"><button class="btn btn-ghost btn-icon" type="button" aria-label="表示テーマ: システム" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu-1"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg></button><div class="dropdown" id="theme-menu-1" role="menu" aria-label="表示テーマ" hidden><button class="dropdown-item" role="menuitem" data-preference="system" aria-current="true" aria-label="表示テーマ: システム（選択中）"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>システム<span class="shortcut"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m20 6-11 11-5-5"/></svg></span></button><button class="dropdown-item" role="menuitem" data-preference="light"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>ライト</button><button class="dropdown-item" role="menuitem" data-preference="dark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>ダーク</button></div><span class="small">田中 美咲</span><span class="avatar" role="img" aria-label="田中 美咲のアバター">田</span><button class="btn btn-ghost btn-icon" type="button" aria-label="ユーザーメニュー" aria-haspopup="menu" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
  </header>
  <main class="page-content">
    <header class="page-header"><h1>設定</h1><p class="description">プロフィールとアクセストークンを管理します。</p></header>
    <div class="settings-layout">
      <nav class="settings-nav" aria-label="設定メニュー">
        <a class="btn btn-ghost" href="/settings/profile" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21v-2a8 8 0 0 0-16 0v2"/></svg>プロフィール</a>
        <a class="btn btn-ghost" href="/settings/tokens"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="16" cy="8" r="5"/><path d="m12.5 11.5-9 9H1v-3l3-3h3v-3h3"/></svg>アクセストークン</a>
      </nav>
      <section class="settings-section" aria-labelledby="profile-settings">
        <div class="stack-sm"><h2 id="profile-settings">プロフィール</h2><p class="description">他のユーザーに表示される情報を編集します。</p></div>
        <form class="settings-form">
          <div class="form-field"><span class="label" id="avatar-label">アバター</span><div class="row"><span class="avatar avatar-profile" role="img" aria-label="現在のアバター：田">田</span><div class="stack-sm"><label class="avatar-upload"><span class="btn btn-outline"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M12 3v12m-5-7 5-5 5 5"/></svg>画像を変更</span><input type="file" name="file" accept="image/png,image/jpeg,image/webp" aria-labelledby="avatar-label" aria-describedby="avatar-help"></label><p class="form-description" id="avatar-help">PNG・JPEG・WebP、最大2MB。未設定時は頭文字を表示します。</p></div></div></div>
          <hr class="separator">
          <div class="form-field"><label class="label" for="display-name">表示名</label><input class="input" id="display-name" name="display_name" value="田中 美咲" required autocomplete="name" aria-describedby="display-name-help"><p class="form-description" id="display-name-help">メンバー一覧やプロフィールに表示されます。日本語も使用できます。</p></div>
          <div class="form-field"><label class="label" for="handle">URL用ハンドル</label><input class="input mono" id="handle" name="handle" value="misaki_t" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]{3,32}" autocomplete="username" spellcheck="false" aria-describedby="handle-help profile-url handle-warning"><p class="form-description" id="handle-help">半角英数・ハイフン・アンダースコア、3〜32文字。</p><p class="form-description" id="profile-url">プロフィールURL：<span class="mono">/users/misaki_t</span></p></div>
          <div class="handle-notice" id="handle-warning"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/></svg><div class="stack-sm"><p class="small">ハンドルを変更すると、プロフィールのURLも変わります。</p><p class="small">共有済みのリンクやブックマークを確認してください。</p></div></div>
          <div class="form-actions"><button class="btn btn-default" type="button">変更を保存</button><button class="btn btn-ghost" type="reset">キャンセル</button></div>
        </form>
      </section>
    </div>
  </main>
</div>
<script src="../_shared/theme-toggle.js"></script>
</body>
</html>
